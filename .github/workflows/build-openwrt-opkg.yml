name: Legacy OpenWrt OPKG feed (frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_notice:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'OPKG 23.05/24.10 releases are frozen. Current MultiWAN NFT targets OpenWrt 25.12.x APK feeds with a target-specific socket helper.'
          echo 'Existing legacy release assets remain available; this workflow does not overwrite them.'
