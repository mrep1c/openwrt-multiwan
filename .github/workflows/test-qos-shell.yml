name: Test QoS and NFT compatibility

on:
  pull_request:
    paths:
      - "multiwan-qos/**"
      - "luci-app-multiwan-qos/**"
      - "multiwan-nft/**"
      - "luci-app-multiwan-nft/**"
      - "scripts/install-qos.sh"
      - "scripts/install-nft.sh"
      - "tests/test-qos-*"
      - "tests/test-nft-*"
      - ".github/workflows/test-qos-shell.yml"
  push:
    branches: [main]
    paths:
      - "multiwan-qos/**"
      - "luci-app-multiwan-qos/**"
      - "multiwan-nft/**"
      - "luci-app-multiwan-nft/**"
      - "scripts/install-qos.sh"
      - "scripts/install-nft.sh"
      - "tests/test-qos-*"
      - "tests/test-nft-*"
      - ".github/workflows/test-qos-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  busybox-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static dash nodejs lua5.1

      - name: Check installed script syntax
        run: |
          files="
            multiwan-qos/lib/multiwan-qos/runtime-state.sh
            multiwan-qos/lib/multiwan-qos/process-lock.sh
            multiwan-qos/lib/multiwan-qos/hotplug-common.sh
            multiwan-qos/lib/multiwan-qos/realtime.sh
            multiwan-qos/etc/init.d/multiwan-qos
            multiwan-qos/etc/multiwan-qos.sh
            multiwan-qos/usr/sbin/multiwan-qos-adaptive
            multiwan-qos/usr/sbin/multiwan-qos-agent-watchdog
            luci-app-multiwan-qos/root/usr/libexec/rpcd/luci.multiwan_qos_stats
            multiwan-qos/etc/hotplug.d/iface/13-multiwan-qos-hotplug
            scripts/install-qos.sh
            multiwan-nft/files/lib/multiwan-nft/*.sh
            multiwan-nft/files/etc/init.d/multiwan-nft
            multiwan-nft/files/etc/hotplug.d/iface/*
            multiwan-nft/files/usr/sbin/*
            multiwan-nft/files/usr/libexec/rpcd/*
            scripts/install-nft.sh
          "
          for file in $files; do
            dash -n "$file"
            busybox ash -n "$file"
          done

      - name: Run QoS regression tests with BusyBox ash
        run: |
          busybox ash tests/test-qos-process-lock.sh
          busybox ash tests/test-qos-realtime.sh
          busybox ash tests/test-qos-adaptive-freshness.sh
          busybox ash tests/test-qos-runtime-state.sh
          busybox ash tests/test-qos-lifecycle.sh
          busybox ash tests/test-qos-fixes.sh
          busybox ash tests/test-qos-upstream-fixes.sh
          busybox ash tests/test-nft-routes.sh

      - name: Run QoS regression tests with dash
        run: |
          dash tests/test-qos-process-lock.sh
          dash tests/test-qos-realtime.sh
          dash tests/test-qos-adaptive-freshness.sh
          dash tests/test-qos-runtime-state.sh
          dash tests/test-qos-lifecycle.sh
          dash tests/test-qos-fixes.sh
          dash tests/test-qos-upstream-fixes.sh
          dash tests/test-nft-routes.sh

      - name: Run QoS UI regression tests
        run: node tests/test-qos-ui.js

      - name: Run router agent endpoint regression tests
        run: |
          luac5.1 -p multiwan-qos/www/cgi-bin/multiwan-qos-agent
          lua5.1 tests/test-qos-agent.lua
