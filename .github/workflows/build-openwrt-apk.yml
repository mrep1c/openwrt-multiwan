name: Build OpenWrt APK feed
run-name: OpenWrt 25.12 APK feeds (AArch64, ARMv7, MIPSel)

on:
  workflow_run:
    workflows: ["Auto Bump Component Versions"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_RELEASE: "25.12.6"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      reason: ${{ steps.decide.outputs.reason }}
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load supported architectures
        id: targets
        run: |
          echo "matrix=$(python3 -c 'import json; print(json.dumps({"include":json.load(open("scripts/openwrt-apk-targets.json"))},separators=(",",":")))')" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build feed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          build=false
          reason="unsupported event"

          case "$EVENT_NAME" in
            workflow_dispatch)
              build=true
              reason="manual dispatch"
              ;;
            workflow_run)
              if [ "$WORKFLOW_RUN_ACTOR" = "github-actions[bot]" ]; then
                reason="ignoring the bot-authored auto-bump follow-up run"
              elif [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
                reason="auto-bump workflow did not succeed"
              else
                changed_files="$(git diff --name-only HEAD^ HEAD)"
                feed_input_changed=false
                nft_changed=false
                nft_version_changed=false
                qos_changed=false
                qos_version_changed=false
                for path in $changed_files; do
                  [ -n "$path" ] || continue
                  case "$path" in
                    multiwan-nft/*|multiwan-nft-nping/*|luci-app-multiwan-nft/*|multiwan-qos/*|luci-app-multiwan-qos/*|install.sh|VERSION|keys/*|setup-feed.sh|scripts/download-openwrt-sdk.py|scripts/configure-openwrt-sdk.py|scripts/openwrt-apk-targets.json|.github/workflows/build-openwrt-apk.yml)
                      feed_input_changed=true
                      ;;
                  esac
                  case "$path" in
                    multiwan-nft/*|luci-app-multiwan-nft/*|install.sh)
                      nft_changed=true
                      ;;
                  esac
                  case "$path" in
                    multiwan-nft/Makefile|luci-app-multiwan-nft/Makefile)
                      nft_version_changed=true
                      ;;
                  esac
                  case "$path" in
                    multiwan-qos/*|luci-app-multiwan-qos/*|install.sh)
                      qos_changed=true
                      ;;
                  esac
                  case "$path" in
                    multiwan-qos/Makefile|luci-app-multiwan-qos/Makefile)
                      qos_version_changed=true
                      ;;
                  esac
                done

                subject="$(git log -1 --pretty=%s)"
                author_email="$(git log -1 --pretty=%ae)"
                if [ "$author_email" = "41898282+github-actions[bot]@users.noreply.github.com" ] &&
                   case "$subject" in "Bump NFT version to "*|"Bump QoS version to "*|"Bump package versions: "*) true ;; *) false ;; esac; then
                  build=true
                  reason="auto-bump produced a component version commit"
                elif [ "$feed_input_changed" != true ]; then
                  reason="auto-bump completed after a non-feed push"
                elif { [ "$nft_changed" = true ] && [ "$nft_version_changed" != true ]; } ||
                     { [ "$qos_changed" = true ] && [ "$qos_version_changed" != true ]; }; then
                  reason="changed component is still missing a version bump"
                else
                  build=true
                  reason="feed inputs already include their component version changes"
                fi
              fi
              ;;
          esac

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason"

  build:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      SUBTARGET: ${{ matrix.subtarget }}
      RELEASE_TAG: apk-25.12-${{ matrix.architecture }}

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            file \
            gawk \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            openssl \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            zstd

      - name: Download OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openwrt-sdk.tar.zst
          key: openwrt-sdk-${{ env.OPENWRT_RELEASE }}-${{ matrix.target }}-${{ matrix.subtarget }}

      - name: Verify and extract OpenWrt SDK
        run: |
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          python3 scripts/download-openwrt-sdk.py "$OPENWRT_RELEASE" "$TARGET" "$SUBTARGET" "${{ matrix.architecture }}" "$RUNNER_TEMP/openwrt-sdk.tar.zst"
          tar -I zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar.zst" \
            -C "$RUNNER_TEMP/openwrt-sdk" \
            --strip-components=1

      - name: Configure stable APK signing key
        env:
          OPENWRT_APK_PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
        run: |
          cd "$RUNNER_TEMP/openwrt-sdk"
          if [ -z "$OPENWRT_APK_PRIVATE_KEY" ]; then
            echo "OPENWRT_APK_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          printf '%s\n' "$OPENWRT_APK_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          cmp -s public-key.pem "$GITHUB_WORKSPACE/keys/mrep1c-openwrt-multiwan-apk.pem"

      - name: Configure SDK feed
        run: |
          cd "$RUNNER_TEMP/openwrt-sdk"
          echo "src-link multiwan $GITHUB_WORKSPACE" >> feeds.conf.default
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              break
            fi
            echo "OpenWrt feed update failed (attempt $attempt of 3)" >&2
            [ "$attempt" -lt 3 ] || exit 1
            rm -rf feeds/luci feeds/luci.index
            sleep $((attempt * 30))
          done
          ./scripts/feeds install -p multiwan multiwan-nft
          ./scripts/feeds install -p multiwan multiwan-nft-sockopt
          ./scripts/feeds install -p multiwan multiwan-nft-nping
          ./scripts/feeds install -p multiwan luci-app-multiwan-nft
          ./scripts/feeds install -p multiwan multiwan-qos
          ./scripts/feeds install -p multiwan luci-app-multiwan-qos
          python3 "$GITHUB_WORKSPACE/scripts/configure-openwrt-sdk.py" . \
            multiwan-nft multiwan-nft-sockopt multiwan-nft-nping \
            luci-app-multiwan-nft multiwan-qos luci-app-multiwan-qos
          make defconfig

      - name: Cache probe source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openwrt-sources
          key: openwrt-probe-source-${{ hashFiles('multiwan-nft-nping/Makefile') }}

      - name: Build packages
        run: |
          cd "$RUNNER_TEMP/openwrt-sdk"
          make -j"$(nproc)" package/feeds/multiwan/multiwan-nft/compile V=s
          make -j"$(nproc)" package/feeds/multiwan/multiwan-nft-nping/compile V=s DL_DIR="$RUNNER_TEMP/openwrt-sources"
          make -j"$(nproc)" package/feeds/multiwan/luci-app-multiwan-nft/compile V=s
          make -j"$(nproc)" package/feeds/multiwan/multiwan-qos/compile V=s
          make -j"$(nproc)" package/feeds/multiwan/luci-app-multiwan-qos/compile V=s
          make package/index V=s

      - name: Collect APK feed assets
        run: |
          cd "$RUNNER_TEMP/openwrt-sdk"
          feed_dir="$(find bin/packages -mindepth 2 -maxdepth 2 -type d -name multiwan | head -n 1)"
          if [ -z "$feed_dir" ]; then
            echo "Could not find generated bin/packages/*/multiwan directory" >&2
            find bin/packages -maxdepth 3 -type d >&2
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$feed_dir"/*.apk "$GITHUB_WORKSPACE/dist/"
          cp "$feed_dir"/packages.adb "$GITHUB_WORKSPACE/dist/"

          key_file=""
          if [ -f public-key.pem ]; then
            key_file="public-key.pem"
          elif [ -f key-build.pub ]; then
            key_file="key-build.pub"
          else
            key_file="$(find . -maxdepth 3 -type f \( -name "public-key.pem" -o -name "*.pem" -o -name "*.pub" \) | head -n 1 || true)"
          fi

          if [ -z "$key_file" ] || [ ! -s "$key_file" ]; then
            echo "Could not find APK feed public signing key" >&2
            find . -maxdepth 3 -type f -name "*key*" >&2
            exit 1
          fi

          cp "$key_file" "$GITHUB_WORKSPACE/dist/mrep1c-openwrt-multiwan-apk.pem"

          apk_count="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name "*.apk" | wc -l)"
          test "$apk_count" -ge 6
          test "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'multiwan-nft-sockopt-*.apk' | wc -l)" -eq 1
          test "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'multiwan-nft-nping-*.apk' | wc -l)" -eq 1
          test -s "$GITHUB_WORKSPACE/dist/packages.adb"
          test -s "$GITHUB_WORKSPACE/dist/mrep1c-openwrt-multiwan-apk.pem"

          {
            echo "OpenWrt $OPENWRT_RELEASE APK feed for ${{ matrix.architecture }}"
            echo
            echo "Install the feed public key first:"
            echo "uclient-fetch -O /etc/apk/keys/mrep1c-openwrt-multiwan-apk.pem https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/mrep1c-openwrt-multiwan-apk.pem"
            echo
            echo "Router APK feed URL:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/packages.adb"
            echo
            echo "Packages:"
            find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name "*.apk" -printf "- %f\n" | sort
          } > "$GITHUB_WORKSPACE/dist/RELEASE_NOTES.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk-feed-${{ env.OPENWRT_RELEASE }}-${{ env.TARGET }}-${{ env.SUBTARGET }}
          path: dist/*

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --notes-file dist/RELEASE_NOTES.txt
            gh release upload "$TAG" dist/*.apk dist/mrep1c-openwrt-multiwan-apk.pem --clobber
            gh release upload "$TAG" dist/packages.adb --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "OpenWrt $OPENWRT_RELEASE APK feed for ${{ matrix.architecture }}" \
              --notes-file dist/RELEASE_NOTES.txt
            gh release upload "$TAG" dist/*.apk dist/mrep1c-openwrt-multiwan-apk.pem --clobber
            gh release upload "$TAG" dist/packages.adb --clobber
          fi
